name: Bug Report
description: Report a bug that spans multiple Butler components
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For bugs affecting a single component, please open an issue in that component's repository instead.
        See [COMPONENTS.md](https://github.com/butlerdotdev/butler/blob/main/COMPONENTS.md) for links.

  - type: dropdown
    id: component
    attributes:
      label: Affected Components
      description: Which Butler components are affected?
      multiple: true
      options:
        - butler-controller
        - butler-bootstrap
        - butler-cli (butleradm)
        - butler-cli (butlerctl)
        - butler-console
        - butler-server
        - butler-charts
        - steward
        - capi-steward
        - butler-portal
        - butler-provider-harvester
        - butler-provider-nutanix
        - Multiple / Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version and environment details.
      value: |
        - Butler version:
        - Kubernetes version:
        - Infrastructure provider: (Harvester / Nutanix / other)
        - OS:
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant log output. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem.
    validations:
      required: false
